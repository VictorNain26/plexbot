# plexbot on victorserv (~/plexbot). The image is the one CI built from the commit
# deploy/deploy.sh promotes ($IMAGE_TAG); nothing is built on the server.
# Files next to it, never committed: .env (DISCORD_GUILD_ID), secrets/ (the two tokens), data/.
services:
  plexbot:
    image: ghcr.io/victornain26/plexbot:${IMAGE_TAG:?set by deploy/deploy.sh}
    container_name: plexbot
    restart: unless-stopped
    environment:
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set in .env}
      # Plex runs on the host, outside Docker.
      PLEX_URL: http://host.docker.internal:32400
      PLEX_CLIENT_ID: plexbot-victorserv
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - discord_token
      - plex_token
    volumes:
      - ./data:/data
    # Hardening: nothing writable but /data and a /tmp in memory, no capability, no setuid.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

secrets:
  discord_token:
    file: ./secrets/discord_token
  plex_token:
    file: ./secrets/plex_token
