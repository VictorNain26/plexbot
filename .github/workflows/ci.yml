name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Publishes the image of a branch on demand, to try it on the server before merging. Its
  # attestation names that branch, so deploy/deploy.sh (main only) never installs it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token reads the repository and nothing else; only `publish` gets more
# (docs.github.com/en/actions/reference/security/secure-use, least privilege).
permissions:
  contents: read

jobs:
  check:
    name: Check (format, lint, types, tests, mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The audio integration test runs the real ffmpeg (libopus), as the image does.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Mutation testing of the logic (queue, Plex mapping, formats); fails under 80 %.
      - run: npm run mutation
      - name: Deploy script syntax
        run: bash -n deploy/deploy.sh

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: plexbot:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The built image has its runtime: Node, ffmpeg with libopus (it encodes the Opus), DAVE.
      - name: Image smoke test
        run: |
          docker run --rm --entrypoint ffmpeg plexbot:ci -hide_banner -encoders | grep -q libopus
          docker run --rm --entrypoint node plexbot:ci -e "
            const r = require('@discordjs/voice').generateDependencyReport();
            console.log(r);
            for (const s of ['@snazzah/davey: 0.', 'aes-256-gcm: yes', 'libopus: yes']) if (!r.includes(s)) process.exit(1);
          "

  # Published from main once checked (or on demand, see workflow_dispatch): the server pulls
  # `sha-<commit>` and verifies its provenance attestation before running it (deploy/deploy.sh).
  publish:
    name: Publish image
    needs: [check, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/victornain26/plexbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
